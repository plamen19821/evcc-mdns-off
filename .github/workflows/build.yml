name: Build EVCC mDNS OFF

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      evcc_version:
        description: "EVCC Version"
        required: true
        default: "0.315.0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: plamen19821/evcc-mdns-off

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine EVCC version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.evcc_version }}" ]; then
            VERSION="${{ inputs.evcc_version }}"
          else
            VERSION="$(tr -d '\r\n' < EVCC_VERSION)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building EVCC $VERSION"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./evcc-mdns-off
          file: ./evcc-mdns-off/Dockerfile
          push: true
          build-args: |
            EVCC_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/plamen19821/evcc-mdns-off
